<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V2O · 本机控制台</title>
<style>
:root{
  --bg:#10181A; --panel:#18262A; --panel2:#142024;
  --text:#D8E4DE; --dim:#8FA5A0; --line:#274044;
  --orange:#E07B39; --green:#7FB069; --red:#C65D4E; --yellow:#D9A441;
  --input-bg:#0C1214;
  --title-font:"Songti SC","Noto Serif SC",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
:root[data-theme="light"]{
  --bg:#F4F1E8; --panel:#FBF9F3; --panel2:#ECE7D8;
  --text:#1A1A18; --dim:#6B6A60; --line:#D8D2C0;
  --orange:#C8402A; --green:#3A6B7C; --red:#B03028; --yellow:#8A6D1B;
  --input-bg:#FFFFFF;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px}
header.top{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel2)}
header.top h1{font-family:var(--title-font);font-size:20px;margin:0;letter-spacing:2px}
header.top h1 .v2o{color:var(--orange)}
header.top .meta{font-family:var(--mono);font-size:12px;color:var(--dim)}
header.top .lock{margin-left:auto;font-family:var(--mono);font-size:12px;padding:4px 12px;border:1px solid var(--line);border-radius:20px}
header.top .lock.on{color:var(--green);border-color:var(--green)}
header.top .lock.off{color:var(--dim)}
header.top .theme{font-family:var(--mono);font-size:12px;padding:4px 12px;border:1px solid var(--line);border-radius:20px;background:transparent;color:var(--text);cursor:pointer}
main{display:grid;grid-template-columns:220px 1fr 300px;gap:12px;padding:12px 20px;max-width:1280px;margin:0 auto}
@media (max-width:900px){main{grid-template-columns:1fr}}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
section h2{font-size:13px;color:var(--dim);margin:0 0 10px;font-weight:600}
.tape{background:var(--input-bg);border:1px solid var(--line);border-radius:6px;padding:10px 8px;position:relative}
.tape::before{content:"V2O · 本机磁带";display:block;font-family:var(--mono);font-size:10px;color:var(--orange);letter-spacing:2px;margin-bottom:8px}
.tape .leader{height:6px;background:var(--orange);border-radius:3px;margin-bottom:10px}
.seg{margin:8px 0;padding:6px 8px;background:var(--panel2);border-left:3px solid var(--dim);border-radius:0 4px 4px 0}
.seg .nm{font-size:12px}
.seg .sub{font-size:11px;color:var(--dim)}
.seg .holes{height:8px;margin-top:6px;border-radius:2px;
  background-image:radial-gradient(circle, var(--input-bg) 2.2px, var(--dim) 2.4px, transparent 2.6px);
  background-size:12px 8px;background-repeat:repeat-x;opacity:.7}
.seg.ok{border-color:var(--green)} .seg.ok .nm{color:var(--green)}
.seg.warn{border-color:var(--orange)} .seg.warn .nm{color:var(--orange)}
.seg.err{border-color:var(--red)} .seg.err .nm{color:var(--red)}
label.flab{display:block;font-size:12px;color:var(--text);margin:8px 0 4px}
label.flab .req{color:var(--orange)}
.pathrow{display:flex;gap:6px;margin-bottom:2px}
.pathrow input{flex:1 1 auto;background:var(--input-bg);border:1px solid var(--line);color:var(--text);
  border-radius:4px;padding:7px 10px;font-family:var(--mono);font-size:12px;min-width:0}
.pathrow input.bad{border-color:var(--red)}
.pathrow input.good{border-color:var(--green)}
.pathrow button{flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--text);
  border-radius:4px;padding:7px 10px;cursor:pointer;font-size:12px;font-family:var(--mono)}
.vhint{font-size:12px;margin:2px 0 6px;min-height:16px}
.vhint.err{color:var(--red)} .vhint.ok{color:var(--green)} .vhint.warn{color:var(--yellow)}
details.adv{margin:6px 0;border:1px dashed var(--line);border-radius:4px;padding:6px 8px}
details.adv summary{cursor:pointer;color:var(--dim);font-size:12px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.controls button{background:var(--orange);border:none;color:#fff;font-weight:700;
  border-radius:4px;padding:7px 16px;cursor:pointer;font-size:13px}
.controls button.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:400}
.controls button:disabled{opacity:.55;cursor:not-allowed}
.controls button.ready{box-shadow:0 0 0 2px var(--green)}
.controls button:active{transform:translateY(1px)}
.hint{font-size:12px;color:var(--dim);margin:0 0 6px}
.hint.err{color:var(--red)} .hint.ok{color:var(--green)} .hint.warn{color:var(--yellow)}
#liveBar{display:none;margin:0 0 8px;padding:8px 10px;border-radius:6px;font-size:12px;
  background:rgba(127,176,105,.12);border:1px solid var(--green);color:var(--green)}
#preview{font-size:12px;color:var(--dim);margin:0 0 6px;word-break:break-all}
#longHint{font-size:12px;color:var(--yellow);margin:0 0 6px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{color:var(--dim);text-align:left;font-weight:600;padding:6px;border-bottom:1px solid var(--line)}
td{padding:6px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12px;word-break:break-all}
tbody tr{cursor:pointer} tbody tr:hover td{background:var(--panel2)}
tbody tr.sel td{background:var(--panel2)}
.st-ok{color:var(--green)} .st-bad{color:var(--red)} .st-warn{color:var(--orange)}
.empty{padding:24px 12px;color:var(--dim);line-height:2}
.empty b{color:var(--text)}
.empty ol{margin:8px 0;padding-left:20px}
.kv{font-size:12px;line-height:2}
.kv .k{color:var(--dim)} .kv .v{font-family:var(--mono);word-break:break-all}
.kv .failbox{margin:8px 0;padding:8px 10px;border:1px solid var(--red);border-radius:6px;background:rgba(198,93,78,.08)}
.kv .failbox .r{color:var(--red);font-weight:700}
.kv .failbox .n{color:var(--text)}
.kv button,.mini{font-size:12px;padding:4px 10px;border-radius:4px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer}
.kv button.go{background:var(--orange);border:none;color:#fff;font-weight:700}
footer{max-width:1280px;margin:0 auto;padding:0 20px 20px;color:var(--dim);font-size:11px;font-family:var(--mono)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50}
.modal.open{display:block}
.box{max-width:560px;margin:8vh auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.box h3{margin:0 0 8px;font-size:14px}
.crumbs{font-family:var(--mono);font-size:12px;color:var(--dim);margin-bottom:8px;word-break:break-all}
.crumbs a{color:var(--orange);cursor:pointer;text-decoration:none}
.dirs{max-height:40vh;overflow:auto;border:1px solid var(--line);border-radius:4px}
.dirs div{padding:8px 10px;font-family:var(--mono);font-size:12px;cursor:pointer;border-bottom:1px solid var(--line)}
.dirs div:hover{background:var(--panel2)}
.box .row{display:flex;gap:8px;margin-top:10px}
.box .row button{flex:1;background:var(--orange);border:none;color:#fff;font-weight:700;border-radius:4px;padding:8px;cursor:pointer}
.box .row button.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:400}
#browseInfo{font-size:12px;margin:6px 0}
#browseInfo.warn{color:var(--yellow)}
#progress{margin:0 0 10px;padding:8px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;font-size:12px}
#progText{font-size:12px;margin-bottom:6px;word-break:break-all}
#progStageText{font-size:12px;color:var(--dim);margin:6px 0 4px;word-break:break-all}
.bar{height:8px;background:var(--input-bg);border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-bottom:4px;display:flex}
#progFillOk{height:100%;width:0%;background:var(--green);transition:width .3s}
#progFillFail{height:100%;width:0%;background:var(--red);transition:width .3s}
#progFillPending{height:100%;width:0%;background:var(--dim);opacity:.45;transition:width .3s}
#progStageFill{height:100%;width:0%;background:var(--orange);transition:width .3s}
#candidateApplyProgress{margin:6px 0}
#candidateApplyFill{height:100%;width:0%;background:var(--green);transition:width .3s}
.stageNote{font-size:11px;color:var(--dim)}
#toasts{position:fixed;right:16px;bottom:16px;z-index:99;display:flex;flex-direction:column;gap:8px}
.toast{padding:10px 14px;border-radius:6px;font-size:13px;max-width:360px;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.3)}
.toast.ok{background:rgba(127,176,105,.95);color:#10231a}
.toast.err{background:rgba(198,93,78,.95);color:#fff}
.copybtn{margin-left:6px}
.notebox{margin-top:8px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel2)}
.notebox pre{white-space:pre-wrap;word-break:break-all;font-family:var(--sans);font-size:12px;max-height:40vh;overflow:auto;margin:6px 0 0}
.obdis{color:var(--dim);cursor:not-allowed;text-decoration:none}
header.top .lock.warn{color:var(--yellow);border-color:var(--yellow)}
.mini.go,.outrow .mini.go{background:var(--orange);border:none;color:#fff;font-weight:700}
.runsheadbtns{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.runsheadbtns button{font-size:12px;padding:4px 10px;border-radius:4px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer}
.runsheadbtns button.go{background:var(--orange);border:none;color:#fff;font-weight:700}
.notestatus{margin:6px 0;padding:6px 8px;border-radius:4px;font-size:12px;word-break:break-all;line-height:1.6}
.notestatus.warn{background:rgba(217,164,65,.14);border:1px solid var(--yellow);color:var(--yellow)}
.notestatus.ok{color:var(--dim)}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.outrow{display:flex;gap:6px;align-items:center;justify-content:flex-start;flex-wrap:nowrap}
.outrow .mini,.outrow .obbtn{flex:0 0 auto;height:24px;line-height:22px;padding:0 10px;font-size:12px;
  border-radius:4px;border:1px solid var(--line);background:transparent;color:var(--text);
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;box-sizing:border-box}
.outrow a.obbtn{cursor:pointer}
.obhint{font-size:11px;color:var(--dim);margin-top:2px;line-height:1.5}
#queueLine{font-size:12px;color:var(--dim);margin-top:4px}
#vocabBox{margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--panel2)}
#vocabBox h3{margin:0 0 6px;font-size:13px}
#vocabList{font-size:12px;font-family:var(--mono);margin-bottom:6px}
#vocabListDetails{margin:6px 0;border:1px dashed var(--line);border-radius:5px;padding:6px 8px}
#vocabListDetails>summary{cursor:pointer;color:var(--text);font-size:12px}
#vocabFilter{width:100%;margin:6px 0;background:var(--input-bg);border:1px solid var(--line);color:var(--text);border-radius:4px;padding:6px 8px;font-size:12px}
#vocabList .vocabGroup{margin:5px 0;border-top:1px dashed var(--line)}
#vocabList .vocabGroup>summary{cursor:pointer;color:var(--dim);padding:4px 0}
#presetBox{margin:2px 0 6px;font-size:12px}
#presetBox .presetRow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:3px 0;border-bottom:1px dashed var(--line)}
#presetBox label{cursor:pointer;white-space:nowrap}
#presetBox .mini{margin-left:4px}
#presetBox .presetEntries{flex:1 0 100%;margin:2px 0 4px;padding:4px 8px;border-left:2px solid var(--line);max-height:180px;overflow:auto}
#presetBox .presetEntries .pentry{font-family:var(--mono);padding:2px 0;word-break:break-all}
#vocabList .vrow{display:flex;gap:6px;align-items:center;padding:3px 0;border-bottom:1px dashed var(--line)}
#vocabList .vrow span{flex:1;word-break:break-all}
#candidateBox{margin-top:8px;padding:8px;border:1px dashed var(--line);border-radius:5px;background:var(--input-bg)}
#candidateBox h4{margin:0 0 5px;font-size:12px;color:var(--text)}
#candidateBox .candHead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
#candidateBox .candHead label{font-size:12px;white-space:nowrap}
#candidateBox .candGroup{margin:5px 0}.candGroup summary{cursor:pointer;color:var(--dim);font-size:12px}
#candidateBox .candGroupHead{color:var(--text);cursor:pointer}
#candidateBox .candRow{display:flex;gap:5px;align-items:flex-start;padding:3px 0;border-top:1px dashed var(--line);font-size:12px;line-height:1.5}
#candidateBox .candRow input{margin-top:4px}.candText{flex:1;word-break:break-all}.candEvidence{color:var(--dim);font-size:11px}
#candidateBox .candEvidenceDetails{margin-top:2px;color:var(--dim);font-size:11px}
</style>
</head>
<body>
<header class="top">
  <h1><span class="v2o">V2O</span> 本机控制台</h1>
  <span class="meta">本地运行 · 数据默认在外置测试目录</span>
  <span class="lock off" id="lock">● 未监听</span>
  <button class="theme" id="btnTheme" title="切换深色/浅色">◐ 浅色</button>
</header>
<main>
  <section>
    <h2>流水线磁带</h2>
    <div class="tape">
      <div class="leader"></div>
      <div id="tape"></div>
    </div>
  </section>
  <section>
    <h2>处理任务</h2>
    <div id="liveBar"></div>
    <label class="flab" for="inInput">视频文件夹 <span class="req">（必填）</span></label>
    <div class="pathrow">
      <input id="inInput" placeholder="如 /Users/你的名字/Movies/待转写">
      <button data-browse="inInput" title="浏览目录">浏览</button>
    </div>
    <div class="vhint" id="vInput"></div>
    <label class="flab" for="inVault">笔记库目录（选填，不填也能转）</label>
    <div class="pathrow">
      <input id="inVault" placeholder="如 /Users/你的名字/笔记库，不填则只存数据目录">
      <button data-browse="inVault" title="浏览目录">浏览</button>
    </div>
    <div class="vhint" id="vVault"></div>
    <details class="adv" id="advBox">
      <summary>高级（一般不用点开）</summary>
      <label class="flab" for="inData">数据目录（一般不用改）</label>
      <div class="pathrow">
        <input id="inData" placeholder="默认外置测试目录，一般不用改">
        <button data-browse="inData" title="浏览目录">浏览</button>
      </div>
      <div class="vhint" id="vData"></div>
    </details>
    <div class="controls">
      <button id="btnStart">开始监听</button>
      <button class="ghost" id="btnStop" style="display:none">停止</button>
      <button class="ghost" id="btnRefresh">刷新</button>
      <button class="ghost" id="btnClear">清空本目录任务</button>
      <button class="ghost" id="btnNewData" style="display:none">一键换新数据目录</button>
    </div>
    <p class="hint" id="msg">每 5 秒自动轮询状态。</p>
    <p class="hint" id="editHint" style="display:none"></p>
    <p class="hint" id="preview"></p>
    <p class="hint warn" id="longHint" style="display:none"></p>
    <p class="hint" id="worker"></p>
    <div id="progress"><div id="progText">空闲：暂无排队视频</div><div class="bar"><div id="progFillOk"></div><div id="progFillFail"></div><div id="progFillPending"></div></div><div id="queueLine"></div><div id="progStageText" style="display:none"></div><div class="bar" id="stageBarWrap" style="display:none"><div id="progStageFill"></div></div><div class="stageNote" id="stageNote" style="display:none">步骤进度非精确百分比，仅表示当前在哪一步</div></div>
    <div id="runsHead" class="hint" style="display:none"></div>
    <div id="runsWrap"><table>
      <thead><tr><th>任务</th><th>来源</th><th>状态</th><th>输出</th><th>更新时间</th><th>操作</th></tr></thead>
      <tbody id="runs"></tbody>
    </table></div>
    <div class="empty" id="empty" style="display:none"></div>
    <div id="vocabBox">
      <h3>词汇（错词→正词，新转写自动应用；错词至少2字，2-3字短词二次确认）</h3>
      <div class="hint" id="vocRev"></div>
      <div id="presetBox"></div>
      <div class="vhint" id="vPreset"></div>
      <div id="candidateBox">
        <h4>待审清单（AI 找到的疑似错词）</h4>
        <div class="candHead"><label><input type="checkbox" id="candidateSelectAll"> 全选</label><button class="mini" id="btnCandidateApply" disabled>错词重跑</button><label><input type="checkbox" id="candidateRerunOld" disabled> 已跑过的也重跑</label><label><input type="checkbox" id="candidateOnlyNew" checked disabled> 只对新视频生效</label></div>
        <div id="candidateApplyProgress" style="display:none">
          <div class="bar"><div id="candidateApplyFill"></div></div>
          <div class="hint" id="candidateApplyText"></div>
        </div>
        <div id="candidateList"><div class="hint">正在读取待审清单…</div></div>
        <div class="vhint" id="vCandidate"></div>
      </div>
      <details id="vocabListDetails">
        <summary id="vocabListSummary">已导入词库（0条）</summary>
        <input id="vocabFilter" type="search" placeholder="筛选错词或正词（空即显示全部）">
        <div id="vocabList"></div>
      </details>
      <div class="pathrow">
        <input id="vocWrong" placeholder="错词（转写里听错的样子）">
        <input id="vocRight" placeholder="正词（你想要的样子）">
        <button id="btnVocAdd" title="添加错→正对子">添加</button>
      </div>
      <div class="vhint" id="vVoc"></div>
      <div class="controls">
        <button class="ghost" id="btnReapplyAll" title="全部已完成任务应用新词库重跑（转写0次，改过的笔记跳过）">全部应用新词库重跑</button>
      </div>
    </div>
  </section>
  <section>
    <h2>选中任务详情</h2>
    <div class="kv" id="lineage"><span class="k">点击左侧任意一行查看详情。</span></div>
  </section>
</main>
<div class="modal" id="modal"><div class="box">
  <h3>选择目录</h3>
  <div class="crumbs" id="crumbs"></div>
  <div id="browseInfo"></div>
  <div class="dirs" id="bdirs"></div>
  <div class="row">
    <button id="btnPick">选定当前目录</button>
    <button class="ghost" id="btnClose">关闭</button>
  </div>
</div></div>
<div class="modal" id="clearModal"><div class="box">
  <h3>清空本目录任务（先看清代价）</h3>
  <div id="clearCost" style="font-size:13px;line-height:1.9;white-space:pre-wrap;word-break:break-all"></div>
  <div class="hint" id="clearMsg" style="margin-top:8px"></div>
  <div class="row">
    <button class="ghost" id="btnClearCancel">取消</button>
    <button id="btnClearFailed">只清失败</button>
    <button id="btnClearAll" style="background:var(--red)">全部清空</button>
  </div>
</div></div>
<div id="toasts"></div>
<footer id="foot">采集 · —</footer>
<script>
"use strict";
var SEGS=[
  {id:"found",nm:"发现",sub:"发现的视频"},
  {id:"task",nm:"任务",sub:"待处理的任务"},
  {id:"raw",nm:"原文",sub:"原始听写"},
  {id:"tidy",nm:"整理",sub:"整理后的文字"},
  {id:"draft",nm:"成稿",sub:"可存的笔记初稿"},
  {id:"store",nm:"入库",sub:"存入笔记库"},
  {id:"archive",nm:"归档",sub:"归档记录"}
];
var selected=null, cache={runs:[]};
var browseTarget=null, browsePath="";
var detailsByRun={}, lastSnap=null, lastFetchAt=0, lastStageAt=0, lastStageKey="";
var prevDone=-1, prevFailed=-1, notifAsked=false, longInInput=0;
// P0-1 三路径 localStorage 持久化（清空则回默认，不崩）
var LS_INPUT="v2o-input-root", LS_VAULT="v2o-vault-root", LS_DATA="v2o-data-root";
function lsGet(k){try{return localStorage.getItem(k)||"";}catch(e){return "";}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function savePaths(){
  try{
    var a=el("inInput").value.trim(), b=el("inVault").value.trim(), c=el("inData").value.trim();
    if(a)lsSet(LS_INPUT,a); if(b)lsSet(LS_VAULT,b); if(c)lsSet(LS_DATA,c);
    if(!a){try{localStorage.removeItem(LS_INPUT);}catch(e){}}
    if(!b){try{localStorage.removeItem(LS_VAULT);}catch(e){}}
    if(!c){try{localStorage.removeItem(LS_DATA);}catch(e){}}
  }catch(e){}
}
function restorePathsFromLS(){
  try{

function el(id){return document.getElementById(id);}
function applyTheme(t){
  // 默认浅色：只有显式 dark 才深色，其余（空/脏值/读不到）一律 light
  var use=(t==="dark")?"dark":"light";
  document.documentElement.setAttribute("data-theme", use);
  el("btnTheme").textContent = use==="light" ? "◑ 深色" : "◐ 浅色";
  try{localStorage.setItem("v2o-theme", use);}catch(e){}
}
(function initTheme(){
  var t="light";
  try{
    if(!localStorage.getItem("v2o-theme-migrated")){
      // 一次性迁移：旧版同键曾默认 dark 并回写，先清污染再强制 light，写标记
      localStorage.removeItem("v2o-theme");
      localStorage.setItem("v2o-theme-migrated","1");
      t="light";
    }else{
      // 迁移已完成：照旧读取，记住用户手动切换
      t=localStorage.getItem("v2o-theme")||"light";
    }
  }catch(e){t="light";}
  applyTheme(t);
})();
el("btnTheme").onclick=function(){
  var cur=document.documentElement.getAttribute("data-theme")||"light";
  applyTheme(cur==="light"?"dark":"light");
};
function dataRoot(){return el("inData").value.trim();}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function stripQuotes(raw){
  if(typeof raw!=="string")return "";
  var t=raw.trim();
  if(t.length>=2 && t[0]===t[t.length-1] && (t[0]==="'"||t[0]==='"'))t=t.slice(1,-1).trim();
  return t;
}
function statusCN(r, cur){
  var wid=r.run_id, d=detailsByRun[wid];
  var ws=d?d.state:null;
  if(cur && cur.run_id===wid && cur.stage){
    var st=cur.stage;
    if(st==="发现")return "发现中";
    if(st==="听写中"||st==="整理中"||st==="成稿中"||st==="入库中")return st;
  }
  if(ws==="PUBLISHED")return "已入库";
  if(ws==="RENDER_ONLY")return "已成稿未入库";
  if(ws==="FAIL")return "失败";
  if(ws==="PUBLISH_BLOCKED")return "入库受阻";
  var s=String(r.status||"");
  if(s==="FAILED_RETRYABLE")return "失败可重试";
  if(s==="NO_SPEECH_DETECTED")return "未检测到语音";
  return "排队中";
}
function stClass(cn){
  cn=String(cn||"");
  if(/失败|受阻/.test(cn))return "st-bad";
  if(/排队|发现|听写|整理|成稿|入库中|重试|未检测/.test(cn))return "st-warn";
  return "st-ok";
}
function segState(id,counts,err){
  var c=counts||{};
  function n(t){var o=0;Object.keys(c[t]||{}).forEach(function(k){o+=c[t][k];});return o;}
  if(err>0&&(id==="found"||id==="task"))return "err";
  if(id==="found")return n("sources")>0?"ok":"";
  if(id==="task")return n("processing_runs")>0?"ok":"";
  if(id==="raw")return (n("artifacts")>0||n("processing_runs")>0)?"ok":"";
  if(id==="tidy"||id==="draft")return n("artifacts")>0?"ok":"";
  if(id==="store")return n("discovery_candidates")>0?"warn":"";
  if(id==="archive")return n("archive_commits")>0?"ok":"";
  return "";
}
function renderTape(snap){
  var counts=snap&&snap.counts_by_state||{}, err=(snap&&snap.error_count)||0;
  var h="";
  SEGS.forEach(function(s){
    var st=segState(s.id,counts,err);
    h+='<div class="seg '+st+'" title="'+esc(s.sub)+'"><div class="nm">'+esc(s.nm)+'</div><div class="sub">'+esc(s.sub)+'</div><div class="holes"></div></div>';
  });
  el("tape").innerHTML=h;
}
function outPathFor(run_id){
  var d=detailsByRun[run_id];
  if(!d)return null;
  if(d.state==="PUBLISHED"&&d.canonical_output_path)return d.canonical_output_path;
  if(d.state==="RENDER_ONLY"&&d.rendered_path)return d.rendered_path;
  if(d.state==="PUBLISH_BLOCKED"&&d.rendered_path)return d.rendered_path;
  if(d.state==="PUBLISH_BLOCKED"&&d.canonical_output_path)return d.canonical_output_path;
  return null;
}
function vaultBase(p){p=String(p||"").replace(/\/+$/,"");var i=p.lastIndexOf("/");return i>=0?p.slice(i+1):p;}
function shortId(id){try{var s=String(id||"");return s.length>6?s.slice(-6):s;}catch(e){return String(id||"");}}
function filenameForRun(r){
  try{
    if(r&&typeof r.source_filename==="string"&&r.source_filename.trim())return r.source_filename.trim();
    if(r&&r.run_id&&detailsByRun[r.run_id]&&detailsByRun[r.run_id].source_filename)return String(detailsByRun[r.run_id].source_filename);
  }catch(e){}
  return "未知文件";
}
function filenameForRunId(run_id){
  try{
    for(var i=0;i<(cache.runs||[]).length;i++){
      var r=cache.runs[i];
      if(r&&String(r.run_id)===String(run_id)){
        if(r.source_filename)return String(r.source_filename);
        break;
      }
    }
    if(detailsByRun[run_id]&&detailsByRun[run_id].source_filename)return String(detailsByRun[run_id].source_filename);
    var w=lastLock&&lastLock.worker;
    if(w&&w.processed){
      for(var j=w.processed.length-1;j>=0;j--){
        var p=w.processed[j];
        if(p&&String(p.run_id)===String(run_id)&&p.source_filename)return String(p.source_filename);
      }
    }
    if(w&&w.current&&String(w.current.run_id)===String(run_id)&&w.current.filename)return String(w.current.filename);
  }catch(e){}
  return "未知文件";
}
// UX2-P1-3/P1-7：失败判定与“原因/下一步”拆解（列表头批量重试/复制原因共用）
function isFailedRun(r){
  var d=detailsByRun[r.run_id];
  if(d&&d.state)return d.state==="FAIL"||d.state==="PUBLISH_BLOCKED";
  var s=String(r.status||"");
  return /^FAILED/.test(s)||s==="NO_SPEECH_DETECTED";
}
function failPartsForRun(r){
  var d=detailsByRun[r.run_id];
  var blocked=!!(d&&d.state==="PUBLISH_BLOCKED");
  var v=d?String(d.verdict||""):"";
  var parts=v.split("→");
  var reason=(parts[0]||(blocked?"初稿已保留，入库未完成":"转写没成功")).trim()||"转写没成功";
  var next=(parts[1]||(blocked?"检查笔记库权限后点重试入库":"点重试再试一次")).trim()||"点重试再试一次";
  return {reason:reason,next:next,blocked:blocked};
}
function failedRuns(){
  var out=[];
  (cache.runs||[]).forEach(function(r){
    try{ if(r&&isFailedRun(r))out.push(r); }catch(e){}
  });
  return out;
}
// UX2-P1-7：来源人话标签＝视频文件夹尾段＋文件名（哈希只进 title）
function sourceLabelForRun(r){
  var fn=filenameForRun(r);
  var tail="";
  try{ tail=String((r&&r.source_dir_tail)||""); }catch(e){ tail=""; }
  if(tail)return tail+"/"+fn;
  return fn;
}
function obLinkFor(run_id){
  var d=detailsByRun[run_id];
  var vault=(lastLock&&lastLock.ob_vault_root)||"";
  if(!vault)return {url:null,reason:"未配置笔记库，在上方填入笔记库目录后重起即用"};
  var vr=lastLock?lastLock.vault_registered:undefined;
  if(vr===false)return {url:null,reason:"先在OB中把该文件夹打开为仓库后再点",needRegister:true};
  if(!d||d.state!=="PUBLISHED"||!d.canonical_output_path)return {url:null,reason:"该任务尚未入库，入库后可用"};
  var cp=String(d.canonical_output_path), v=String(vault).replace(/\/+$/,"");
  if(cp!==v&&cp.indexOf(v+"/")!==0)return {url:null,reason:"输出不在当前笔记库内"};
  var rel=cp===v?"":cp.slice(v.length+1);
  return {url:"obsidian://open?vault="+encodeURIComponent(vaultBase(v))+"&file="+encodeURIComponent(rel),reason:null};
}
function obClickHint(e){
  try{
    var t=e&&e.target?e.target:null;
    var ob=obLinkFor(t?t.getAttribute("data-obrun"):"");
    if(ob&&ob.needRegister){
      if(e&&e.preventDefault)e.preventDefault();
      try{
        var box=t?(t.parentElement?((t.parentElement.parentElement)||t.parentElement):null):null;
        var hint=box?box.querySelector(".obhint"):null;
        if(hint){hint.textContent="先在OB中把该文件夹打开为仓库后再点";}
        else if(t&&t.parentElement){
          var d=document.createElement("div");
          d.className="obhint";
          d.textContent="先在OB中把该文件夹打开为仓库后再点";
          t.parentElement.appendChild(d);
        }
      }catch(_){}
      return false;
    }
  }catch(err){}
  return true;
}
function revealPath(p){
  fetch("/api/reveal",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({path:p})})
  .then(function(r){return r.json().then(function(o){return{code:r.status,o:o};});})
  .then(function(x){
    if(x.code===200){toast("已在访达中定位","ok");}
    else{toast(String((x.o&&x.o.error)||("定位失败："+x.code)),"err");say(String((x.o&&x.o.error)||("定位失败："+x.code)),"err");}
  }).catch(function(e){toast("在访达中定位失败："+e,"err");say("在访达中定位失败："+e,"err");});
}
function finderUrlFor(run_id){
  var d=detailsByRun[run_id];
  if(d&&d.finder_url)return d.finder_url;
  var p=outPathFor(run_id);
  if(!p)return null;
  try{
    var parts=String(p).split("/");
    for(var i=0;i<parts.length;i++){parts[i]=encodeURIComponent(parts[i]);}
    return "file://"+parts.join("/").replace(/%3A/gi,":");
  }catch(e){return null;}
}
function outCellFor(run_id){
  var out=outPathFor(run_id);
  if(!out)return "—";
  var h='<span class="outrow"><button class="mini" data-reveal="'+esc(out)+'" title="'+esc(out)+'">访达</button>';
  var ob=obLinkFor(run_id);
  if(ob.url)h+='<a class="obbtn" href="'+esc(ob.url)+'" data-obrun="'+esc(run_id)+'" title="在 Obsidian 中打开">OB</a>';
  else h+='<span class="obdis mini" title="'+esc(ob.reason||"OB不可用")+'">OB</span>';
  h+='</span><div class="obhint">打不开？确认OB中已打开同名库</div>';
  return h;
}
// UX2-P0-1：列表头一行“共N个（成功A/失败B/排队C），当前显示M个”，截断必须明示，禁静默丢
// UX2-P1-2：失败>1给“重试全部失败（N个）”；失败>0给“复制全部失败原因”
// UX2-P1-5：未监听（或跨多目录）时按输入目录分组列成功/失败/排队
function renderRunsHead(snap){
  var box=el("runsHead");
  if(!box)return;
  var runs=(snap&&snap.recent_runs)||[];
  cache.runs=runs;
  var shown=runs.length;
  var rs=(snap&&snap.run_summary)||null;
  var t;
  if(!rs){
    if(shown>0){box.style.display="block";box.className="hint";t="共 "+shown+" 个，当前显示 "+shown+" 个";}
    else{box.style.display="none";box.innerHTML="";return;}
  }else{
    var total=parseInt(rs.total!=null?rs.total:0,10);if(isNaN(total))total=0;
    var done=parseInt(rs.done!=null?rs.done:0,10);if(isNaN(done))done=0;
    var failed=parseInt(rs.failed!=null?rs.failed:0,10);if(isNaN(failed))failed=0;
    var pending=parseInt(rs.pending!=null?rs.pending:0,10);if(isNaN(pending))pending=0;
    var m=parseInt(rs.shown!=null?rs.shown:shown,10);if(isNaN(m))m=shown;
    var limit=parseInt(rs.limit!=null?rs.limit:200,10);if(isNaN(limit))limit=200;
    var truncated=!!rs.truncated||total>m;
    t="共 "+total+" 个（成功 "+done+"/失败 "+failed+"/排队 "+pending+"），当前显示 "+m+" 个";
    if(truncated){
      var left=Math.max(0,total-m);
      t+=" · 截断：仅显示前 "+m+" 个（共 "+total+" 个，还有 "+left+" 个未显示）。本次每次最多取 "+limit+" 条，请先处理/收口，或换更小的视频文件夹再刷新。";
      box.className="hint warn";
    }else{
      box.className="hint";
    }
    // UX2-P1-5：按输入目录分组（未监听或跨多目录时展示归属；成功/失败分input计）
    try{
      var groups=(rs.groups||[]);
      var running=!!(lastLock&&lastLock.running);
      if(groups.length>0&&(!running||groups.length>1)){
        var gs=groups.map(function(g){
          return esc(String(g.dir_tail||"（无归属目录）"))+" 成功"+parseInt(g.done||0,10)+"/失败"+parseInt(g.failed||0,10)+"/排队"+parseInt(g.pending||0,10)+"（共"+parseInt(g.total||0,10)+"）";
        });
        t+=" · 按文件夹："+gs.join(" ｜ ");
      }
    }catch(e){}
  }
  var flist=failedRuns();
  var nRetry=flist.length;
  var btnHtml="";
  if(nRetry>1)btnHtml+='<button class="go" id="btnRetryAllFailed">重试全部失败（'+nRetry+'个）</button>';
  if(nRetry>0)btnHtml+='<button id="btnCopyFailedReasons">复制全部失败原因</button>';
  box.style.display="block";
  box.innerHTML=esc(t)+(btnHtml?('<div class="runsheadbtns">'+btnHtml+'</div>'):"");
  var rb=el("btnRetryAllFailed");if(rb)rb.onclick=retryAllFailed;
  var cb=el("btnCopyFailedReasons");if(cb)cb.onclick=copyAllFailedReasons;
}
function renderRuns(snap){
  lastSnap=snap;
  var runs=(snap&&snap.recent_runs)||[];
  cache.runs=runs;
  renderRunsHead(snap);
  var tb=el("runs");
  var cur=(lastLock&&lastLock.worker&&lastLock.worker.current)||null;
  tb.innerHTML=runs.map(function(r,i){
    var cn=statusCN(r,cur);
    var outCell=outCellFor(r.run_id);
    var d=detailsByRun[r.run_id];
    var dbFail=/^FAILED/.test(String(r.status||""))||String(r.status||"")==="NO_SPEECH_DETECTED";
    // 详情缺失时以库状态兜底判失败（67合成只有库行时也能逐行重试）
    var hasDetail=!!(d&&d.state);
    var failed=hasDetail?(d.state==="FAIL"||d.state==="PUBLISH_BLOCKED"):dbFail;
    // UX2-P1-3：行内只留一个主按钮（入库受阻→重试入库；其余失败→重试）；
    // 重跑收进详情“应用新词库重跑”，行内禁两相似动词并排。
    var ops=[];
    if(failed){
      var mainLabel=(hasDetail&&d.state==="PUBLISH_BLOCKED")?"重试入库":"重试";
      ops.push('<button class="mini go" data-retry="'+esc(r.run_id)+'" data-retryfn="'+esc(filenameForRun(r))+'">'+mainLabel+'</button>');
    }
    var op=ops.length?ops.join(" "):"—";
    var fn=filenameForRun(r);
    var sid=shortId(r.run_id);
    var taskCell='<div>'+esc(fn)+'</div><div style="font-size:11px;color:var(--dim)">…'+esc(sid)+'</div>';
    // UX2-P1-7/P1-5：来源列显“文件夹尾段＋文件名”，裸哈希只进 title
    return '<tr data-i="'+i+'" class="'+(selected===i?"sel":"")+'"><td title="'+esc(r.run_id)+'">'+taskCell+'</td><td title="'+esc(r.source_id||"")+'">'+esc(sourceLabelForRun(r))+'</td><td class="'+stClass(cn)+'">'+esc(cn)+'</td><td>'+outCell+'</td><td>'+esc(r.updated_at)+'</td><td>'+op+'</td></tr>';
  }).join("");
  var showEmpty=!snap||snap.ok===false||runs.length===0;
  el("empty").style.display=showEmpty?"block":"none";
  el("runsWrap").style.display=showEmpty?"none":"block";
  if(showEmpty){
    if(snap&&snap.ok===false){
      el("empty").innerHTML="<b>状态库还没有建立。</b>按三步开始：<ol><li>在上方填入<b>视频文件夹的绝对路径</b>；</li><li>点击「<b>开始监听</b>」；</li><li>把视频丢进该文件夹。</li></ol>不填笔记库也能转，md在数据目录的 jobs 里，页面每行会给路径。<br>原因："+esc(snap.message||"未知");
    }else{
      el("empty").innerHTML="<b>还没有任务。</b>按三步开始：<ol><li>在上方填入<b>视频文件夹的绝对路径</b>（如 /Users/你的名字/Movies/待转写）；</li><li>点击「<b>开始监听</b>」；</li><li>把视频丢进该文件夹，任务会自动出现在这里。</li></ol>不填笔记库也能转，md在数据目录的 jobs 里，页面每行会给路径。<br>数据默认写在外置测试目录，不碰真实库。";
    }
  }
  Array.prototype.forEach.call(tb.querySelectorAll("tr"),function(tr){
    tr.onclick=function(e){
      if(e.target&&(e.target.getAttribute("data-retry")||e.target.getAttribute("data-reapply")||e.target.getAttribute("data-reveal")||e.target.getAttribute("data-copy")||e.target.getAttribute("data-obrun")))return;
      selected=parseInt(tr.getAttribute("data-i"),10);renderRuns(snap);renderLineage();
    };
  });
  Array.prototype.forEach.call(tb.querySelectorAll("[data-retry]"),function(b){
    b.onclick=function(e){e.stopPropagation();retryRun(b.getAttribute("data-retry"));};
  });
  Array.prototype.forEach.call(tb.querySelectorAll("[data-reapply]"),function(b){
    b.onclick=function(e){e.stopPropagation();reapplyOne(b.getAttribute("data-reapply"));};
  });
  Array.prototype.forEach.call(tb.querySelectorAll("[data-reveal]"),function(b){
    b.onclick=function(e){e.stopPropagation();revealPath(b.getAttribute("data-reveal"));};
  });
  Array.prototype.forEach.call(tb.querySelectorAll("[data-copy]"),function(b){
    b.onclick=function(e){e.stopPropagation();copyText(b.getAttribute("data-copy"));};
  });
  Array.prototype.forEach.call(tb.querySelectorAll("[data-obrun]"),function(a){
    a.onclick=function(e){return obClickHint(e);};
  });
  el("foot").textContent="采集 · "+(snap?(snap.collected_at||"—"):"—");
  renderLineage();
}
function fmtDur(created, updated){
  try{
    var a=Date.parse(created), b=Date.parse(updated);
    if(isNaN(a)||isNaN(b)||b<a)return "—";
    var s=Math.round((b-a)/1000);
    if(s<60)return s+" 秒";
    return Math.floor(s/60)+" 分 "+(s%60)+" 秒";
  }catch(e){return "—";}
}
function renderLineage(){
  var r=cache.runs[selected];
  if(!r){el("lineage").innerHTML='<span class="k">点击左侧任意一行查看详情。</span>';return;}
  var d=detailsByRun[r.run_id];
  var cur=(lastLock&&lastLock.worker&&lastLock.worker.current)||null;
  var cn=statusCN(r,cur);
  var h='<div><span class="k">任务：</span><span class="v">'+esc(r.run_id)+'</span></div>';
  h+='<div><span class="k">来源：</span><span class="v" title="'+esc(r.source_id||"")+'">'+esc(sourceLabelForRun(r))+'</span></div>';
  h+='<div><span class="k">状态：</span><span class="v">'+esc(cn)+'</span></div>';
  h+='<div><span class="k">耗时：</span><span class="v">'+esc(fmtDur(r.created_at,r.updated_at))+'</span></div>';
  if(d&&(d.state==="PUBLISHED"||d.state==="RENDER_ONLY")){
    var p=outPathFor(r.run_id);
    var concl=d.state==="PUBLISHED"?"已存入你的笔记库":"已生成初稿在数据目录，未入库";
    h+='<div><span class="k">结论：</span><span class="v">'+esc(concl)+'</span></div>';
    if(p){

      h+='<div><span class="k">输出：</span><span class="v">未产出</span></div>';
    }
  }else if(d&&(d.state==="FAIL"||d.state==="PUBLISH_BLOCKED")){
    var pb=d.state==="PUBLISH_BLOCKED";
    var p2=pb?outPathFor(r.run_id):null;
    if(pb){
      h+='<div><span class="k">结论：</span><span class="v">初稿已保留，入库未完成</span></div>';
      if(p2){
        h+='<div><span class="k">输出：</span><span class="v">'+esc(p2)+'</span> <button class="mini copybtn" data-copy="'+esc(p2)+'">复制</button></div>';
      }else{
        h+='<div><span class="k">输出：</span><span class="v">未产出</span></div>';
      }
    }else{

function stageStep(stage){
  if(stage==="发现")return {n:1,pct:10};
  if(stage==="听写中")return {n:2,pct:60};
  if(stage==="整理中")return {n:3,pct:75};
  if(stage==="成稿中")return {n:4,pct:90};
  if(stage==="入库中")return {n:5,pct:100};
  return {n:1,pct:10};
}
function renderProgress(w){
  var cur=w&&w.current, q=(w&&w.queue)||{pending:0,done:0,failed:0};
  var pending=parseInt(q.pending||0,10), done=parseInt(q.done||0,10), failed=parseInt(q.failed||0,10);
  var total=q.total!=null?parseInt(q.total||0,10):(pending+done+failed);
  if(isNaN(total))total=pending+done+failed;
  if(total<0)total=0;
  // UX2-P1-8：分段进度（绿成功／红失败／灰排队），失败不再计入成功，100%仅当排队0且失败0
  var okPct=total>0?Math.round(done*100/total):0;
  var failPct=total>0?Math.round(failed*100/total):0;
  if(okPct+failPct>100){okPct=Math.min(okPct,100);failPct=Math.max(0,100-okPct);}
  var pendPct=Math.max(0,100-okPct-failPct);
  el("progFillOk").style.width=okPct+"%";
  el("progFillFail").style.width=failPct+"%";
  el("progFillPending").style.width=pendPct+"%";
  var counts="成功 "+done+"/失败 "+failed+"/排队 "+pending+"，共 "+total;
  var txt="";
  var now=Date.now();
  var heart=Math.max(0,Math.round((now-lastFetchAt)/1000));
  var heartS=" · 心跳 "+heart+"s 前更新";
  if(cur&&cur.run_id){
    var secs="";
    var stageDur=0;
    try{
      var t0=Date.parse(cur.stage_started_at);
      if(!isNaN(t0)){stageDur=Math.max(0,Math.round((now-t0)/1000));secs=" · 已用时 "+stageDur+"s";}
    }catch(e){}
    var st=stageStep(cur.stage);
    txt="正在"+cur.stage+" "+cur.filename+"（第 "+st.n+" 步/共 5 步：发现→听写→整理→成稿→入库）"+secs+heartS+" · "+counts;
    if(longInInput>0)txt+=" · 长视频分段中";
    if(stageDur>60)txt+=" · 还在跑，长视频请勿关闭页面";
    el("progStageText").style.display="block";
    el("progStageText").textContent="当前这一步："+cur.stage+"（第 "+st.n+"/5 步）";
    el("stageBarWrap").style.display="block";
    el("progStageFill").style.width=st.pct+"%";
    el("stageNote").style.display="block";
  }else if(pending>0||done>0||failed>0){
    // 收口口径：排队0才算收口；失败>0 明示“含失败B”，绝不显示成全绿100%
    if(pending===0){
      txt=counts+" · 已收口"+(failed>0?("（含失败 "+failed+"）"):"（全部成功）")+heartS;
    }else{
      txt=counts+" · 等待新视频…"+heartS;
    }
    el("progStageText").style.display="none";
    el("stageBarWrap").style.display="none";
    el("stageNote").style.display="none";
  }else{
    txt="空闲：暂无排队视频";
    el("progStageText").style.display="none";
    el("stageBarWrap").style.display="none";
    el("stageNote").style.display="none";
  }
  el("progText").textContent=txt;
}

function copyText(t){
  function fallback(){
    try{
      var ta=document.createElement("textarea");
      ta.value=t;document.body.appendChild(ta);ta.select();
      document.execCommand("copy");document.body.removeChild(ta);
      say("已复制："+t,"ok");
    }catch(e){say("复制失败，请手动拷贝："+t,"warn");}
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){say("已复制："+t,"ok");},fallback);
  }else fallback();
}
function retryRun(run_id){
  var fn=filenameForRunId(run_id);
  say("正在重试 "+fn+"…");
  fetch("/api/retry",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({run_id:run_id})})
  .then(function(r){return r.json().then(function(o){return{code:r.status,o:o};});})
  .then(function(x){
    if(x.code===202){say("已重新排队："+fn+"，只重跑这一个","ok");toast("已重新排队："+fn,"ok");}
    else say("重试失败："+(x.o.error||x.code),"err");
    refresh();
  }).catch(function(e){say("重试请求失败："+e,"err");});

// UX2-P1-2：一键重试全部失败（逐个调已有 /api/retry，幂等；前端给“N/total 已排队”进度）
function retryAllFailed(){
  var list=failedRuns();
  if(!list.length){say("当前没有失败任务可重试。","warn");return;}
  if(!confirm("重试全部失败 "+list.length+" 个吗？\n会逐个重新排队（幂等，成功任务不受影响）。"))return;
  var total=list.length, okN=0, badN=0, i=0;
  say("正在重试全部失败：0/"+total+" 已排队…");
  function step(){
    if(i>=total){
      say("重试全部失败完成：已排队 "+okN+"/"+total+(badN?("，失败请求 "+badN):"")+"。","ok");
      toast("已排队 "+okN+"/"+total+" 个失败任务","ok");
      refresh();
      return;
    }
    var rid=list[i].run_id;
    fetch("/api/retry",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({run_id:rid})})
    .then(function(r){return r.json().then(function(o){return{code:r.status,o:o};});})
    .then(function(x){if(x.code===202)okN++;else badN++;})
    .catch(function(){badN++;})
    .then(function(){i++;say("正在重试全部失败："+i+"/"+total+" 已排队…");step();});
  }
  step();
}
// UX2-P1-2：复制全部失败原因（文件名＋归属＋原因＋下一步）
function copyAllFailedReasons(){
  var list=failedRuns();

  var lines=["V2O 失败原因清单（共 "+list.length+" 个）",""];

    var tail=String((r&&r.source_dir_tail)||"");
    lines.push((idx+1)+". "+filenameForRun(r)+(tail?("（归属："+tail+"）"):""));

function renderVocabApplyProgress(s){

  }else{

function renderVocabApplyFinal(s){
  el("candidateApplyProgress").style.display="";

function vocabApplyStartTimer(){

  if(!vocabApplyTimer)vocabApplyTimer=setInterval(pollVocabApplyStatus,1500);

function vocabApplyNotePollFailure(err){
  vocabApplyFailStreak++;
  el("candidateApplyProgress").style.display="";  // 提示必须可见，不许静默
  var tooLong=(vocabApplyStartedAt>0)&&((Date.now()-vocabApplyStartedAt)>VOCAB_APPLY_MAX_MS);
  if(vocabApplyFailStreak<VOCAB_APPLY_MAX_FAIL&&!tooLong){
    vocabApplySetText("进度读取失败，正在重试…（第"+vocabApplyFailStreak+"次："
      +String(err||"网络错误")+"）","warn");
    return;  // 单次/短暂失败不停表，继续轮询
  }
  vocabApplyStopPoll();vocabApplyRunning=false;el("btnCandidateApply").disabled=false;
  // M4：停表原因文案必须准确（连续失败 vs 累计超时）
  var why=(vocabApplyFailStreak>=VOCAB_APPLY_MAX_FAIL)
    ? ("进度读取连续失败"+vocabApplyFailStreak+"次")
    : ("进度刷新累计超过"+Math.round(VOCAB_APPLY_MAX_MS/60000)+"分钟仍未完成");
  vocabApplySetText(why+"，已停止自动刷新；后台任务可能仍在跑，"
    +"请点「刷新」或稍后重开页面查看","err");
}
function pollVocabApplyStatus(){
  fetch("/api/vocab/candidates/apply/status").then(function(r){return r.json();}).then(function(o){
    var s=o&&o.job;
    if(!s){vocabApplyFailStreak=0;vocabApplyStopPoll();vocabApplyRunning=false;el("btnCandidateApply").disabled=false;return;}
    vocabApplyFailStreak=0;
    if(s.state==="running"){
      vocabApplyRunning=true;el("btnCandidateApply").disabled=true;
      renderVocabApplyProgress(s);
      vocabApplyStartTimer();
      return;
    }
    vocabApplyStopPoll();vocabApplyRunning=false;el("btnCandidateApply").disabled=false;
    renderVocabApplyFinal(s);
    loadVocab();loadVocabCandidates();refresh();
  }).catch(function(e){vocabApplyNotePollFailure(e);});
}
function resumeVocabApplyPoll(){
  // 页面重载续看：只有后端还有进行中的任务才接管进度显示，终态不打扰。
  fetch("/api/vocab/candidates/apply/status").then(function(r){return r.json();}).then(function(o){
    var s=o&&o.job;
    if(s&&s.state==="running"){
      vocabApplyRunning=true;el("btnCandidateApply").disabled=true;
      vocabApplyFailStreak=0;vocabApplyStartedAt=Date.now();
      renderVocabApplyProgress(s);
      vocabApplyStartTimer();
    }
  }).catch(function(){
    // 载入时读不到：仍开表限期重试；连续失败由 poll 的容错给明确提示，不静默冻结
    vocabApplyFailStreak=0;vocabApplyStartedAt=Date.now();
    vocabApplyStartTimer();
  });
}
function applyVocabCandidates(){
  var ids=candidateCheckboxes().filter(function(c){return c.checked;}).map(function(c){return Number(c.getAttribute("data-candidate-index"));});
  if(!ids.length){el("vCandidate").textContent="先勾选至少一条待审候选";el("vCandidate").className="vhint err";return;}
  var rerunOld=el("candidateRerunOld").checked;
  if(!confirm(rerunOld?"导入所选错词并重跑全部已完成任务吗？\n转写0次，改过的笔记会按 No-Clobber 跳过。":"只导入所选错词，不重跑老稿吗？\n老稿保持不动，新视频会自动应用。"))return;
  el("btnCandidateApply").disabled=true;vocabApplyRunning=true;
  vocabApplyFailStreak=0;vocabApplyStartedAt=Date.now();
  el("vCandidate").textContent="";el("vCandidate").className="vhint";
  renderVocabApplyProgress({state:"running",stage:"importing",rerun_old:rerunOld,total:0,done:0});
  fetch("/api/vocab/candidates/apply",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(reapplyPayload({indices:ids,rerun_old:rerunOld}))})
  .then(function(r){return r.json().then(function(o){return{code:r.status,o:o};});})
  .then(function(x){
    var o=x.o||{};
    if(x.code===202){vocabApplyStartTimer();pollVocabApplyStatus();return;}
    if(x.code===409){vocabApplySetText(String(o.error||"已有任务在进行中"),"warn");resumeVocabApplyPoll();return;}
    vocabApplyRunning=false;el("btnCandidateApply").disabled=false;
    vocabApplySetText(String(o.error||o.message||("处理失败："+x.code)),"err");
  }).catch(function(e){
    vocabApplyRunning=false;el("btnCandidateApply").disabled=false;
    vocabApplySetText("错词重跑请求失败："+e,"err");
  });
}

  if(irf)qs.push("input_root="+encodeURIComponent(irf));

    if(o&&o.error)say("启动失败："+o.error,"err");

    try{loadPresets();}catch(e){}
    try{loadVocabCandidates();}catch(e){}
    try{resumeVocabApplyPoll();}catch(e){}
  }
  Promise.all([p1,p2]).then(function(){
    refreshing=false;
    el("btnRefresh").disabled=false;
    el("btnRefresh").textContent="刷新";
  });
}
function openBrowser(target){
  browseTarget=target;
  el("modal").classList.add("open");
  loadDir(el(target).value.trim()||"");
}
function loadDir(p){
  fetch("/api/browse?path="+encodeURIComponent(p||"")).then(function(r){
    return r.json().then(function(o){return{code:r.status,o:o};});
  }).then(function(x){
    if(x.code!==200){say("浏览失败："+(x.o.error||x.code),"err");return;}
    browsePath=x.o.path;
    var parts=x.o.path.split("/").filter(function(s){return s;});
    var h='<a data-p="/">/</a>';
    var acc="";
    parts.forEach(function(s){
      acc+="/"+s;
      h+='<a data-p="'+esc(acc)+'">'+esc(s)+"</a>/";
    });
    h+=' <span>(上级：<a data-p="'+esc(x.o.parent)+'">..</a>)</span>';
    el("crumbs").innerHTML=h;
    Array.prototype.forEach.call(el("crumbs").querySelectorAll("a"),function(a){
      a.onclick=function(){loadDir(a.getAttribute("data-p"));};
    });
    var counts=x.o.counts||{};
    el("bdirs").innerHTML=x.o.dirs.map(function(d){
      var n=counts[d]!=null?counts[d]:null;
      var suffix=n!=null?"（"+n+" 个视频）":"";
      return "<div data-d=\""+esc(d)+"\">📁 "+esc(d)+suffix+"</div>";
    }).join("")||"<div>（空目录）</div>";
    Array.prototype.forEach.call(el("bdirs").querySelectorAll("div[data-d]"),function(d){
      d.onclick=function(){loadDir(browsePath+"/"+d.getAttribute("data-d"));};
      d.ondblclick=function(){el(browseTarget).value=browsePath+"/"+d.getAttribute("data-d");closeBrowser();validateInput(browseTarget);};
    });
    var v=x.o.videos||{total:0,sample:[],long_estimate:0};
    var info="当前目录有 "+(v.total||0)+" 个视频";
    if((v.sample||[]).length)info+="（如 "+v.sample.slice(0,3).join("、")+"）";
    var cls="";
    if((v.total||0)===0){info+=" · 该目录无视频文件，选了也转不出东西";cls="warn";}
    if((v.long_estimate||0)>0)info+=" · 检测到长视频 "+v.long_estimate+" 个（按大小估算），转写可能超 "+(v.long_estimate*10)+" 分钟，分段进行请勿关闭页面";
    var bi=el("browseInfo");
    bi.textContent=info;
    bi.className=cls;
  }).catch(function(e){say("浏览请求失败："+e,"err");});
}
function closeBrowser(){el("modal").classList.remove("open");}
Array.prototype.forEach.call(document.querySelectorAll("[data-browse]"),function(b){
  b.onclick=function(){openBrowser(b.getAttribute("data-browse"));};
});
el("btnClose").onclick=closeBrowser;
el("modal").onclick=function(e){if(e.target===el("modal"))closeBrowser();};
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeBrowser();});
el("btnPick").onclick=function(){if(browseTarget){el(browseTarget).value=browsePath;}closeBrowser();if(browseTarget)validateInput(browseTarget);};
el("btnRefresh").onclick=function(){refresh(false);};
function validateInput(which, cb){
  var map={inInput:["inInput","vInput",true],inVault:["inVault","vVault",false],inData:["inData","vData",false]};
  var cfg=map[which];
  if(!cfg){if(cb)cb(true);return;}
  var input=el(cfg[0]), hint=el(cfg[1]), required=cfg[2];
  var raw=input.value;
  var cleaned=stripQuotes(raw);
  if(cleaned!==raw.trim()){
    input.value=cleaned;
    hint.textContent="已自动去掉首尾引号";
    hint.className="vhint warn";
  }
  var v=input.value.trim();
  function done2(ok, msg, cls){
    if(msg!=null){hint.textContent=msg;hint.className="vhint "+cls;}
    input.classList.remove("bad","good");
    input.classList.add(ok?"good":"bad");
    updateStartReady();
    if(cb)cb(ok);
  }
  if(!v){
    if(which==="inVault"){done2(true,"不填也能转，md只存数据目录，每行会给路径","ok");return;}
    if(which==="inData"){done2(true,"用默认外置测试目录","ok");return;}
    done2(false,"请填写视频文件夹绝对路径","err");return;
  }
  fetch("/api/browse?path="+encodeURIComponent(v)).then(function(r){
    return r.json().then(function(o){return{code:r.status,o:o};});
  }).then(function(x){
    if(x.code===200){
      var vv=x.o.videos||{total:0,long_estimate:0};
      if(which==="inInput"){
        longInInput=vv.long_estimate||0;
        var lh=el("longHint");
        if(longInInput>0){
          lh.style.display="block";
          lh.textContent="检测到长视频 "+longInInput+" 个（按大小估算），转写可能超 "+(longInInput*10)+" 分钟，分段进行请勿关闭页面";
        }else lh.style.display="none";
      }
      var msg="路径可用";
      if(which==="inInput"&&(vv.total||0)===0)msg="路径可用，但该目录暂无视频文件";
      if(hint.textContent==="已自动去掉首尾引号"&&x.code===200){
        // 保留去引号回显，追加可用
        hint.textContent="已自动去掉首尾引号，路径可用";
        hint.className="vhint warn";
        input.classList.remove("bad");input.classList.add("good");
        updateStartReady();if(cb)cb(true);return;
      }
      done2(true,msg,"ok");
    }else{
      if(which==="inInput")longInInput=0;
      done2(false,String(x.o.error||"路径有问题，请点浏览重选"),"err");
    }
  }).catch(function(){
    done2(false,"校验请求失败，请点浏览重选","err");
  });
}
["inInput","inVault","inData"].forEach(function(id){
  el(id).addEventListener("blur",function(){validateInput(id);});
  el(id).addEventListener("input",function(){
    if(lastLock&&lastLock.running){
      var h=el("editHint");
      h.style.display="block";
      h.textContent="修改下次启动生效，当前监听 "+(lastLock.input_root||"");
      h.className="hint warn";
    }
  });
});
function updateStartReady(){
  var okI=!el("inInput").classList.contains("bad");
  var okV=!el("inVault").classList.contains("bad");
  var okD=!el("inData").classList.contains("bad");
  var b=el("btnStart");
  if(okI&&okV&&okD&&!b.disabled)b.classList.add("ready");
  else b.classList.remove("ready");
}
el("btnStart").onclick=function(){
  stopState=null;
  var input=el("inInput").value.trim();
  if(!input){say("请先填写视频文件夹的绝对路径。","err");return;}
  say("正在启动监听…");
  fetch("/api/start",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({data_root:dataRoot()||undefined,input_root:input,
      ob_vault_root:el("inVault").value.trim()||undefined})})
  .then(function(r){return r.json().then(function(o){return{code:r.status,o:o};});})
  .then(function(x){
    if(x.code===202){try{savePaths();}catch(e){}say("已开始监听："+x.o.input_root+"，把视频丢进去即可。","ok");}
    else if(x.code===409){say(String(x.o.error||"已经在监听同一文件夹，无需重复操作"),"warn");}
    else{
      var msg=String(x.o.error||("启动失败："+x.code));
      say(msg,"err");
      if(/没就绪/.test(msg)){
        say(msg+" · 一键启动命令可复制： ./app/start.sh","err");
        toast("转写环境没就绪，可复制一键启动命令： ./app/start.sh","err");
      }
    }
    refresh();
  }).catch(function(e){say("启动请求失败："+e,"err");});
};
el("btnStop").onclick=function(){
  if(stopState&&stopState.finishing)return;
  say("正在停止（先停接新任务，当前任务会跑完收尾）…");
  el("btnStop").disabled=true;
  fetch("/api/stop",{method:"POST"}).then(function(r){return r.json();}).then(function(o){
    o=o||{};
    // UX2-P1-6：三段式——已停止接新任务／当前这个会跑完收尾／重起后已完成跳过、半截重转
    stopState={finishing:!!o.finishing,
      filename:String((o.current&&o.current.filename)||""),
      message:String(o.message||"已停止接新任务；重起后已完成跳过、半截重转。")};
    el("btnStop").disabled=false;
    say(stopState.message,"ok");
    if(stopState.finishing)toast("已停止接新任务，当前任务收尾中…","ok");
    else toast("已停止监听","ok");
    refresh();
  }).catch(function(e){el("btnStop").disabled=false;say("停止失败："+e,"err");});
};
el("btnNewData").onclick=function(){
  var s=(lastLock&&lastLock.suggested_data_root)||"";
  if(!s){say("暂无建议的新数据目录。","warn");return;}
  el("inData").value=s;
  say("已填入新数据目录："+s+"，点开始监听即重起（源视频与笔记不动）。","ok");
  validateInput("inData");
};
// UX2-P0-2：清空前先明示代价（DB N条＋jobs M个 / 预计重转X分钟），
// 二选一“只清失败 / 全部清空”，默认不选全清；清后给撤销指引。
var clearPreview=null;
function clearOpenedRoot(){
  return el("inInput").value.trim()||((lastLock&&lastLock.input_root)||"");
}
function openClearDialog(){
  var ir=clearOpenedRoot();
  if(!ir){say("请先填写要清空的视频文件夹绝对路径。","err");return;}
  clearPreview=null;
  el("clearMsg").textContent="";
  el("clearCost").textContent="正在核对要清的任务与代价…";
  el("btnClearFailed").disabled=true;
  el("btnClearAll").disabled=true;
  el("clearModal").classList.add("open");
  fetch("/api/clear",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({data_root:dataRoot()||undefined,input_root:ir,dry_run:true})})
  .then(function(r){return r.json().then(function(o){return{code:r.status,o:o};});})
  .then(function(x){
    if(x.code!==200||!x.o||!x.o.ok){
      el("clearCost").textContent="无法清空："+String((x.o&&x.o.error)||("HTTP "+x.code));
      return;
    }
    if(x.o.no_tasks){
      el("clearCost").textContent=String(x.o.message||"本目录下没有任务记录，无需清空。");
      return;
    }
    var p=x.o.preview||{};
    var of=p.only_failed||{};
    clearPreview={input_root:ir,preview:p};
    var lines=[];
    lines.push("将删 DB "+p.db_runs+" 条 ＋ jobs "+p.jobs+" 个；vault md 与源视频不动。");
    lines.push("重起需重转约 "+p.est_retranscribe_minutes+" 分钟（按每条约 "+p.avg_sec_per_video+" 秒估算，实际以视频长短为准）。");
    if(p.failed>0)lines.push("失败 "+p.failed+" 条建议先在失败行逐条点「重试」，确需清空再清。");
    lines.push("");
    lines.push("当前共 "+p.total+" 条：成功 "+p.success+" / 失败 "+p.failed+" / 排队 "+p.pending+"。");
    if(p.failed>0){
      lines.push("「只清失败」→ 删 "+of.db_runs+" 条失败记录＋jobs "+of.jobs+" 个，成功 "+p.success+" 条保留（不动）。");
    }else{
      lines.push("（当前没有失败记录，「只清失败」无可清。）");
    }
    lines.push("「全部清空」→ 删全部 "+p.db_runs+" 条，重起会全部重转。");
    el("clearCost").textContent=lines.join("\n");
    el("btnClearFailed").disabled=!(p.failed>0);
    el("btnClearAll").disabled=!(p.db_runs>0);
  }).catch(function(e){
    el("clearCost").textContent="核对失败："+e;
  });
}
function doClear(onlyFailed){
  var ir=clearOpenedRoot();
  if(!ir)return;
  if(!onlyFailed){
    if(!confirm("再次确认：将删除本目录全部 "+((clearPreview&&clearPreview.preview&&clearPreview.preview.db_runs)||"")+" 条任务记录与 jobs 中间文件，不可撤销。\n（源视频与笔记 md 不动，但重起需全部重转。）\n确定要「全部清空」吗？"))return;
  }
  el("clearMsg").textContent="正在清空…";
  el("btnClearFailed").disabled=true;
  el("btnClearAll").disabled=true;
  fetch("/api/clear",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({data_root:dataRoot()||undefined,input_root:ir,only_failed:!!onlyFailed})})
  .then(function(r){return r.json().then(function(o){return{code:r.status,o:o};});})
  .then(function(x){
    if(x.code===200&&x.o&&x.o.ok){
      el("clearModal").classList.remove("open");
      say(String(x.o.message||"已清空。")+" "+String(x.o.undo||""),"ok");
      toast(String(x.o.message||"已清空"),"ok");
      selected=null;refresh();
    }else{
      el("clearMsg").textContent="清空失败："+String((x.o&&x.o.error)||("HTTP "+x.code));
      el("btnClearFailed").disabled=false;
      el("btnClearAll").disabled=false;
    }
  }).catch(function(e){
    el("clearMsg").textContent="清空请求失败："+e;
    el("btnClearFailed").disabled=false;
    el("btnClearAll").disabled=false;
  });
}
el("btnClear").onclick=openClearDialog;
el("btnClearCancel").onclick=function(){el("clearModal").classList.remove("open");};
el("btnClearFailed").onclick=function(){doClear(true);};
el("btnClearAll").onclick=function(){doClear(false);};
el("clearModal").onclick=function(e){if(e.target===el("clearModal"))el("clearModal").classList.remove("open");};
refresh(false);setInterval(function(){refresh(true);},5000);
</script>
